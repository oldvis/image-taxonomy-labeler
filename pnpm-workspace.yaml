  - 'packages/*'
  - 'website'

catalog:
  '@iconify-json/fa6-brands': ^1.2.6
  '@iconify-json/fa6-regular': ^1.2.4
  '@iconify-json/fa6-solid': ^1.2.4
  '@playwright/test': 1.62.1
  '@types/d3': ^7.4.3
  '@types/file-saver': ^2.0.7
  '@types/lodash': ^4.17.24
  '@types/node': ^26.1.1
  '@types/seedrandom': ^3.0.8
  '@unocss/reset': ^66.7.5
  '@vitejs/plugin-vue': ^6.0.8
  '@vue-macros/volar': ^3.1.4
  '@vue/test-utils': ^2.4.11
  '@vueuse/core': ^14.3.0
  axios: ^1.18.1
  d3: ^7.9.0
  element-plus: ^2.14.3
  file-saver: ^2.0.5
  fuse.js: ^7.5.0
  iso-639-3: ^3.0.1
  jsdom: ^29.1.1
  lodash: ^4.18.1
  pinia: ^4.0.2
  pinia-plugin-persistedstate: ^4.7.1
  sass: ^1.101.7
  seedrandom: ^3.0.5
  typescript: ^5.9.3
  unocss: ^66.7.5
  unplugin-auto-import: ^21.0.0
  unplugin-vue-components: ^32.1.0
  unplugin-vue-macros: ^2.14.5
  uuid: ^14.0.1
  v-object-inspector: ^0.1.3
  vite: ^8.1.5
  vite-plugin-pages: ^0.33.3
  vitest: ^4.1.10
  vue: ^3.5.40
  vue-router: ^5.2.0
  vue-tsc: ^3.3.8
  with-progress-bar: ^0.1.2
  zod: ^4.4.3

allowBuilds:
  # Native deps required by Vite / Sass watch.
  '@parcel/watcher': true
  esbuild: true

minimumReleaseAgeExclude:
  - sass@1.101.7

# Keep vue-tsc on 3.1.x: 3.3+ flags template-only refs under noUnusedLocals.
# Keep TypeScript on 5.9.x until typescript-eslint supports TS 7+.
overrides:
  vue-tsc: 3.1.1
  typescript: 5.9.3
