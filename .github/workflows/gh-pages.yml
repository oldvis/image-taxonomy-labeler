name: Build and Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install
        run: pnpm install
      - name: Build label
        env:
          VITE_BASE: /image-taxonomy-labeler/label/
          NODE_OPTIONS: --max_old_space_size=4096
        run: pnpm --filter ./apps/label build
      - name: Build compare
        env:
          VITE_BASE: /image-taxonomy-labeler/compare/
          NODE_OPTIONS: --max_old_space_size=4096
        run: pnpm --filter ./apps/compare build
      - name: Assemble site
        run: pnpm --filter ./website assemble
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
